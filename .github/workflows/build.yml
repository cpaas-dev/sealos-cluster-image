name: Build

# 构建 sealos 集群镜像（rootfs）。
#
# 只能手动触发（workflow_dispatch）：在对应的版本分支上（如 v1.34.x）运行，
# 指定 Kubernetes 版本，lint 后构建、推送镜像，再创建同名 GitHub Release 和 tag；
# 已发布的版本拒绝覆盖。

on:
  workflow_dispatch:
    inputs:
      kubernetes_version:
        description: "Kubernetes version (e.g., v1.33.13)"
        required: true
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          shellcheck -x scripts/*.bash scripts/*/*.bash scripts/*/*.sh build/*.bash .github/scripts/*.bash
      - name: Dockerfile check
        run: docker build --check .

  build:
    name: Build image
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Resolve version
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.kubernetes_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/resolve_build.bash
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.plan.outputs.version }}
          build-args: |
            INST_KUBERNETES_V=${{ steps.plan.outputs.version }}
          # ghcr links a multi-arch package to the repo via the index annotation
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          sbom: false
      - name: Verify manifest list
        run: |
          .github/scripts/verify_manifest.bash \
            "${{ env.IMAGE_NAME }}:${{ steps.plan.outputs.version }}" \
            linux/amd64 linux/arm64
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          .github/scripts/create_release.bash \
            "${{ steps.plan.outputs.version }}" \
            "${{ env.IMAGE_NAME }}:${{ steps.plan.outputs.version }}"
